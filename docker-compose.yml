services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DATABASE: app
    volumes:
      - abiplaner-db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app" ]
      interval: 10s
      timeout: 5s
      retries: 5
  sso:
    image: quay.io/keycloak/keycloak:26.0.5
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - 9090:8080
    command: [ "start-dev", "--import-realm", "--hostname", "https://abiplaner.hopto.org:2020", "--proxy-headers", "xforwarded" ]
    volumes:
      - ./iserv.json:/opt/keycloak/data/import/iserv-realm.json
  backend:
    image: quarkus/abiplaner-jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/app
      QUARKUS_DATASOURCE_USERNAME: app
      QUARKUS_DATASOURCE_PASSWORD: app
      QUARKUS_HTTP_CORS: true
      QUARKUS_HTTP_CORS_ORIGINS: https://abiplaner.hopto.org
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
    restart: always
  frontend:
    image: svelte-docker
    ports:
      - 3000:3000
  proxy:
    image: docker.io/library/caddy:2.8.4
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - /home/abiplaner/Abiplaner/proxy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  abiplaner-db:
  caddy-data:
  caddy-config: