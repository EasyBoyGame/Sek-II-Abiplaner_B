services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DATABASE: app
    volumes:
      - abiplaner-db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app" ]
      interval: 10s
      timeout: 5s
      retries: 5
  sso:
    image: quay.io/keycloak/keycloak:26.0.7
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_DB_URL: jdbc:postgresql://sso-db:5432/app
      KC_DB_POOL_MAX_SIZE: 4
      KC_BOOTSTRAP_ADMIN_USERNAME: super
      KC_BOOTSTRAP_ADMIN_PASSWORD: superjigfordkl3nfsof
      KC_HOSTNAME: https://abiplaner.catalkaya.dev
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: false
      KC_HOSTNAME_ADMIN: http://127.0.0.1:9090
      KC_HTTP_MANAGEMENT_PORT: 9000
    ports:
      - 9090:9090
      - 9000:9000
    command: [ "start" ]
    volumes:
      - ./realm-config.json:/opt/keycloak/data/import/realm-config.json
    depends_on:
      sso-db:
        condition: service_healthy
  sso-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DATABASE: app
    volumes:
      - sso-db:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app" ]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    image: quarkus/abiplaner-jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/app
      QUARKUS_HTTP_CORS_ORIGINS: https://abiplaner.catalkaya.dev
      QUARKUS_OIDC_AUTH_SERVER_URL: https://abiplaner.catalkaya.dev/realms/abiplaner
      QUARKUS_OIDC_CLIENT_ID: abiplaner-backend
      QUARKUS_OIDC_CREDENTIALS_SECRET: 5X4jk2ImTi282Cn7Zd0vsJUJyWpbWLGR
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: svelte-docker
    ports:
      - 3000:3000
  proxy:
    image: caddy:2.8.4
    ports:
      - 80:80
      - 443:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
volumes:
  abiplaner-db:
  sso-db:
  caddy-data:
  caddy-config: